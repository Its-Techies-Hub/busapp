name: AI Code Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Setup Node.js (adjust for your stack)
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm install

    # Step 4: Run lint
    - name: Run lint
      run: npm run lint

    # Step 5: Run unit tests
    - name: Run unit tests
      run: npm test

    # Step 6: Free AI code review (GitHub Copilot CLI trial)
    - name: AI Code Review
      run: |
        echo "POC AI Review Placeholder"
        npm install -g @githubnext/github-copilot-cli
        copilot review ./src --summary
