name: Open Source AI Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: busapp/busapp-webapp

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install linters & AI tools
      run: |
        pip install semgrep codereviewgpt

    - name: Run Semgrep (static + ML rules)
      run: semgrep --config auto

    - name: Run CodeReviewGPT (open AI review)
      run: codereviewgpt analyze --path ./src
