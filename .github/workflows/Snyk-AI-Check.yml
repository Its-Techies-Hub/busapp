name: Snyk Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  snyk-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # Dependency Vulnerability Scan 
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
      - name: Install Snyk CLI globally
        run: npm install -g snyk
        
      # AI-powered code scan
      
      - name: Run Snyk Code AI scan
        working-directory: .  
        run: |
          snyk code test --json-file-output=snyk-code.json --report || echo "Snyk Code scan completed with issues"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        
      # AI-powered remediation (preview feature)
      
      - name: Snyk AI Fix Suggestions
        run: snyk fix --org=<your-org> --json-file-output=snyk-fix.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      - name: Debug - Verify file creation
        run: ls -la
        if: always()
      
      - name: Upload Snyk AI Code Report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-ai-report
          path: snyk-code.json

     
