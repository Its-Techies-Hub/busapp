name: Snyk Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  snyk-security:
    runs-on: ubuntu-latest

    steps:
      
      # 1. Setup Environment
     
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Snyk CLI globally
        run: npm install -g snyk

      
      # 2. Dependency Vulnerability Scan (non-AI)
      
      - name: Run Snyk Dependency Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --sarif-file-output=snyk.sarif

      - name: Upload Dependency Scan Results to GitHub (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

     
      # 3. AI-Powered Code Analysis (Snyk Code)
     
      - name: Run Snyk Code AI Scan
        working-directory: .
        run: |
          snyk code test \
            --project-name=its-techies-hub
            --json-file-output=snyk-code.json \
            --report || echo "Snyk Code scan completed with issues"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      
      # 4. AI-Powered Remediation (Preview)
      
      - name: Run Snyk AI Fix Suggestions
        run: snyk fix --org=its-techies-hub --json-file-output=snyk-fix.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
       # continue-on-error: true

     
      # 5. Debug and Artifact Upload
      
      - name: Debug - Verify Generated Files
        if: always()
        run: ls -la

      - name: Upload Snyk AI Code Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-ai-code-report
          path: snyk-code.json

      - name: Upload Snyk AI Fix Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-ai-fix-report
          path: snyk-fix.json
